<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 | K-방산 스타트업 육성사업</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1f4b;--accent:#1565c0;--green:#0a7c4e;--gl:#e8f5ee;--bg:#f5f7fa;--bg2:#eef1f6;--w:#fff;--text:#1a2340;--t2:#4a5a78;--t3:#8a99b8;--bd:#d4dae8;--red:#c0392b;--yellow:#d4861a;--shadow:0 2px 12px rgba(11,31,75,.08);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}
.logo-bar{background:#fff;border-bottom:1px solid var(--bd);padding:10px 32px;}
.logo-bar-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.logo-group{display:flex;align-items:center;gap:20px;}
.logo-div{width:1px;height:32px;background:var(--bd);}
.wrap{max-width:1400px;margin:0 auto;padding:28px 24px 80px;}
.hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:24px;padding-bottom:18px;border-bottom:2px solid var(--navy);}
.admin-title{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--navy);letter-spacing:2px;}
.admin-title em{color:var(--accent);font-style:normal;}
.lock-row{display:flex;align-items:center;gap:8px;}
.lock-input{background:#fff;border:1.5px solid var(--bd);color:var(--text);padding:9px 14px;font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none;width:180px;border-radius:4px;}
.btn-login{background:var(--navy);border:none;color:#fff;padding:9px 16px;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;border-radius:4px;font-weight:600;}
.btn-logout{background:none;border:1.5px solid var(--bd);color:var(--t2);padding:9px 16px;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;border-radius:4px;}
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
.stat-card{background:#fff;border:1px solid var(--bd);padding:18px 20px;border-radius:8px;box-shadow:var(--shadow);}
.stat-label{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--navy);line-height:1;}
.stat-num.y{color:var(--yellow);}.stat-num.b{color:var(--accent);}.stat-num.g{color:var(--green);}
.stat-sub{font-size:11px;color:var(--t3);margin-top:3px;}
.filters{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.filter-input{background:#fff;border:1.5px solid var(--bd);color:var(--text);padding:8px 12px;font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none;border-radius:4px;width:200px;}
.filter-sel{background:#fff;border:1.5px solid var(--bd);color:var(--t2);padding:8px 12px;font-size:12px;font-family:'Noto Sans KR',sans-serif;outline:none;cursor:pointer;border-radius:4px;}
.btn-export{background:none;border:1.5px solid var(--navy);color:var(--navy);padding:8px 14px;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;border-radius:4px;margin-left:auto;font-weight:600;}
.btn-export:hover{background:var(--navy);color:#fff;}
.table-wrap{background:#fff;border:1px solid var(--bd);border-radius:8px;overflow:hidden;box-shadow:var(--shadow);overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{background:var(--navy);color:rgba(255,255,255,.8);padding:11px 13px;text-align:left;font-size:11px;font-weight:600;white-space:nowrap;}
.tbl td{padding:11px 13px;border-bottom:1px solid var(--bg2);vertical-align:middle;}
.tbl tr:hover td{background:var(--bg);}
.co-name{font-weight:700;color:var(--navy);font-size:13px;}
.ref{font-family:monospace;font-size:11px;color:var(--t3);}
.tech-chip{display:inline-block;background:#e8f0fb;color:var(--accent);font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;}
.s-badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;}
.s-wait{background:#fff8e1;color:#b86a00;border:1px solid #f5c518;}
.s-review{background:#e8f0fb;color:var(--accent);border:1px solid #90b4e8;}
.s-ok{background:var(--gl);color:var(--green);border:1px solid var(--green);}
.s-no{background:#fde8e8;color:var(--red);border:1px solid #e57373;}
.action-btns{display:flex;gap:5px;}
.btn-v{border:1.5px solid var(--accent);color:var(--accent);background:none;padding:4px 10px;font-size:11px;cursor:pointer;border-radius:3px;font-family:'Noto Sans KR',sans-serif;font-weight:600;}
.btn-v:hover{background:var(--accent);color:#fff;}
.btn-s{border:1.5px solid var(--bd);color:var(--t2);background:none;padding:4px 10px;font-size:11px;cursor:pointer;border-radius:3px;font-family:'Noto Sans KR',sans-serif;}
.btn-s:hover{border-color:var(--navy);color:var(--navy);}
.btn-d{border:1.5px solid #e57373;color:var(--red);background:none;padding:4px 8px;font-size:11px;cursor:pointer;border-radius:3px;opacity:.6;}
.btn-d:hover{opacity:1;}
.empty-st{text-align:center;padding:48px 0;color:var(--t2);font-size:13px;}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:flex-start;justify-content:center;padding:32px 20px;overflow-y:auto;}
.modal-bg.on{display:flex;}
.modal-box{background:#fff;border-radius:10px;width:100%;max-width:660px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal-head{padding:18px 24px;background:var(--navy);border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:space-between;}
.modal-head-title{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fff;letter-spacing:2px;}
.modal-close{background:none;border:none;color:rgba(255,255,255,.6);font-size:22px;cursor:pointer;padding:4px 8px;line-height:1;}
.modal-close:hover{color:#fff;}
.modal-body{padding:20px 24px;max-height:70vh;overflow-y:auto;}
.d-sec{margin-bottom:14px;}
.d-sec-title{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:8px;padding-bottom:5px;border-bottom:2px solid var(--bg2);letter-spacing:.5px;text-transform:uppercase;}
.d-row{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--bg2);align-items:start;}
.d-row:last-child{border-bottom:none;}
.d-key{font-size:11px;font-weight:700;color:var(--t2);padding-top:2px;}
.d-val{font-size:13px;color:var(--text);line-height:1.6;word-break:keep-all;}
.modal-foot{padding:14px 24px;border-top:1px solid var(--bd);display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;}
.foot-sel{background:var(--bg);border:1.5px solid var(--bd);color:var(--text);padding:8px 12px;font-size:13px;font-family:'Noto Sans KR',sans-serif;border-radius:4px;outline:none;}
.btn-save{background:var(--navy);color:#fff;border:none;padding:8px 20px;font-weight:700;font-size:13px;cursor:pointer;border-radius:4px;font-family:'Noto Sans KR',sans-serif;}
.btn-save:hover{background:var(--accent);}
.note-area{background:var(--bg);border:1.5px solid var(--bd);color:var(--text);padding:9px 12px;font-size:12px;font-family:'Noto Sans KR',sans-serif;border-radius:4px;resize:vertical;min-height:70px;width:100%;margin-top:6px;outline:none;line-height:1.7;}
/* 파일 */
.file-wrap{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
.file-card{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:5px;gap:10px;}
.file-left{display:flex;align-items:center;gap:8px;min-width:0;}
.file-name{font-size:12px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;}
.file-lbl{font-size:10px;color:var(--t2);}
.btn-dl{background:var(--navy);color:#fff;border:none;padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer;border-radius:3px;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;}
.btn-dl:hover{background:var(--accent);}
/* 상태 알림 배지 */
.status-notice{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:6px;margin-top:10px;font-size:13px;}
.status-notice.review{background:#e8f0fb;border:1px solid #90b4e8;color:var(--accent);}
.status-notice.ok{background:var(--gl);border:1px solid var(--green);color:var(--green);}
.status-notice.no{background:#fde8e8;border:1px solid #e57373;color:var(--red);}
@media(max-width:900px){.stats-row{grid-template-columns:repeat(3,1fr);}}
</style>
</head>

      <input type="password" class="lock-input" id="adminPw" placeholder="관리자 비밀번호" onkeydown="if(event.key==='Enter')doLogin()">

  <div id="lockedView" style="text-align:center;padding:72px 0;">

  </div>

  <div id="adminContent" style="display:none;">
    <div class="stats-row" id="statsRow"></div>

      <input type="text" class="filter-input" id="searchInput" placeholder="기업명, 대표자, 사업자번호..." oninput="renderTable()">

        <option value="">전체 상태</option>
        <option>검토대기</option><option>검토중</option><option>선정</option><option>미선정</option>
      </select>
      <select class="filter-sel" id="techFilter" onchange="renderTable()">
        <option value="">전체 기술분야</option>
        <option>인공지능(AI)</option><option>빅데이터</option><option>드론·UAV</option>
        <option>반도체·시스템반도체</option><option>지능형 로봇</option><option>우주</option>
        <option>사이버보안</option><option>양자</option><option>기타</option>
      </select>
      <select class="filter-sel" id="defFilter" onchange="renderTable()">
        <option value="">방산경험 전체</option><option value="none">경험 없음</option><option value="done">경험 있음</option>
      </select>
      <button class="btn-export" onclick="exportCSV()">📥 CSV</button>

<script>
var ADMIN_PW = 'admin1234';
var API_BASE  = window.location.origin;
var SK_APPS  = 'k_defense_apps';
var apps = [], curId = null;

var FILE_LABELS = {
  techPlan:'① 신청기업 제출자료',
  docsZip: '② 증빙서류 ZIP(10종)',
  etc0:    '③ 기타 서류'
};

/* 로그인 */
async function doLogin(){
  var pw=document.getElementById('adminPw').value;
  if(pw!==ADMIN_PW){
    document.getElementById('adminPw').style.borderColor='var(--red)';
    setTimeout(function(){document.getElementById('adminPw').style.borderColor='';},1500);
    return;
  }
  try{
    var res=await fetch(API_BASE+'/api/admin/apps');
    var data=await res.json();
    if(data.ok) apps=data.data;
    else apps=JSON.parse(localStorage.getItem(SK_APPS)||'[]');
  }catch(e){ apps=JSON.parse(localStorage.getItem(SK_APPS)||'[]'); }
  document.getElementById('lockedView').style.display='none';
  document.getElementById('adminContent').style.display='block';
  document.getElementById('btnLogout').style.display='inline-block';
  renderStats(); renderTable();
}
function doLogout(){
  document.getElementById('lockedView').style.display='block';
  document.getElementById('adminContent').style.display='none';
  document.getElementById('btnLogout').style.display='none';
  document.getElementById('adminPw').value='';
}

/* 통계 */
function renderStats(){
  var t=apps.length;
  var p=apps.filter(function(a){return a.status==='검토대기';}).length;
  var r=apps.filter(function(a){return a.status==='검토중';}).length;
  var s=apps.filter(function(a){return a.status==='선정';}).length;
  var bonus=apps.filter(function(a){return a.defenseExp==='none';}).length;
  document.getElementById('statsRow').innerHTML=
    sc('총 신청','',t,'전체 접수')+sc('검토대기','y',p,'처리 필요')+
    sc('검토중','b',r,'진행중')+sc('선정','g',s,'목표 15개사')+
    sc('가점 해당','g',bonus,'방산경험 없음');
}
function sc(l,c,n,s){
  return '<div class="stat-card"><div class="stat-label">'+l+'</div>'+
         '<div class="stat-num'+(c?' '+c:'')+'">'+n+'</div>'+
         '<div class="stat-sub">'+s+'</div></div>';
}
function sClass(s){return {'검토대기':'s-wait','검토중':'s-review','선정':'s-ok','미선정':'s-no'}[s]||'s-wait';}
function h(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* 테이블 */
function renderTable(){
  var q=(document.getElementById('searchInput').value||'').toLowerCase();
  var sf=document.getElementById('statusFilter').value;
  var tf=document.getElementById('techFilter').value;
  var df=document.getElementById('defFilter').value;
  var list=apps.filter(function(a){
    var m=!q||(a.company||'').toLowerCase().includes(q)||(a.ceo||'').toLowerCase().includes(q)||
            (a.bizNum||'').includes(q)||(a.refNum||'').toLowerCase().includes(q);
    return m&&(!sf||a.status===sf)&&(!tf||a.tech===tf)&&(!df||a.defenseExp===df);
  });
  var tb=document.getElementById('tblBody');
  if(!list.length){tb.innerHTML='<tr><td colspan="9"><div class="empty-st">신청 내역이 없습니다</div></td></tr>';return;}
  tb.innerHTML=list.map(function(a,i){
    var defLabel=a.defenseExp==='none'
      ?'<span style="color:var(--green);font-size:11px;font-weight:600;">없음 ★가점</span>'
      :'<span style="color:var(--red);font-size:11px;">있음</span>';
    return '<tr>'+
      '<td style="color:var(--t3);font-size:11px;">'+(list.length-i)+'</td>'+
      '<td><div class="co-name">'+h(a.company)+'</div><div class="ref">'+h(a.refNum)+'</div></td>'+
      '<td>'+h(a.ceo)+'</td>'+
      '<td style="font-family:monospace;font-size:11px;">'+h(a.bizNum)+'</td>'+
      '<td><span class="tech-chip">'+h(a.tech)+'</span></td>'+
      '<td>'+defLabel+'</td>'+
      '<td style="font-size:11px;color:var(--t2);">'+h(a.appliedAt)+'</td>'+
      '<td><span class="s-badge '+sClass(a.status)+'">'+h(a.status)+'</span></td>'+
      '<td><div class="action-btns">'+
        '<button class="btn-v" onclick="openDetail('+a.id+')">상세</button>'+
        '<button class="btn-s" onclick="cycleStatus('+a.id+')">상태변경</button>'+
        '<button class="btn-d" onclick="delApp('+a.id+')">삭제</button>'+
      '</div></td></tr>';
  }).join('');
}

/* 상태 순환 */
async function cycleStatus(id){
  var cycle=['검토대기','검토중','선정','미선정'];
  var a=apps.find(function(x){return String(x.id)===String(id);});
  if(!a)return;
  a.status=cycle[(cycle.indexOf(a.status)+1)%cycle.length];
  try{await fetch(API_BASE+'/api/admin/apps/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:a.status})});}catch(e){}
  saveLocal(); renderStats(); renderTable();
}

/* 삭제 */
async function delApp(id){
  if(!confirm('삭제하시겠습니까?'))return;
  try{await fetch(API_BASE+'/api/admin/apps/'+id,{method:'DELETE'});}catch(e){}
  apps=apps.filter(function(a){return String(a.id)!==String(id);});
  saveLocal(); renderStats(); renderTable();
}

/* 파일 섹션 */
function buildFileSection(appData){
  var sf=appData.savedFiles||{};
  var su=appData.savedUrls||{};
  var items=[];
  Object.keys(FILE_LABELS).forEach(function(key){
    var name=sf[key]; if(!name)return;
    var ext=(name.split('.').pop()||'').toLowerCase();
    var iconMap={'pdf':'📄','hwp':'📝','hwpx':'📝','docx':'📝','jpg':'🖼️','jpeg':'🖼️','png':'🖼️','zip':'🗜️','pptx':'📊','ppt':'📊'};
    var icon=iconMap[ext]||'📎';
    items.push({name:name,label:FILE_LABELS[key],icon:icon,url:su[key]||''});
  });
  if(!items.length) return '<div style="padding:12px;background:var(--bg);border-radius:4px;font-size:12px;color:var(--t3);">제출 서류 없음</div>';
  return '<div class="file-wrap">'+items.map(function(f){
    // Drive URL 있으면 직접 링크, 없으면 안내
    var btn = f.url
      ? '<a class="btn-dl" href="'+h(f.url)+'" target="_blank" download="'+h(f.name)+'">⬇ 다운로드</a>'
      : '<span style="font-size:11px;color:var(--t3);">Drive URL 없음</span>';
    return '<div class="file-card">'+
      '<div class="file-left"><span style="font-size:18px;">'+f.icon+'</span>'+
      '<div><div class="file-name">'+h(f.name)+'</div><div class="file-lbl">'+h(f.label)+'</div></div></div>'+
      btn+
    '</div>';
  }).join('')+'</div>';
}

/* 상세 모달 */
function openDetail(id){
  var a=null;
  for(var i=0;i<apps.length;i++){if(String(apps[i].id)===String(id)){a=apps[i];break;}}
  if(!a){alert('데이터를 찾을 수 없습니다.');return;}
  curId=id;
  document.getElementById('modalTitle').textContent=a.company||'기업 상세정보';
  var addr=((a.addr||'')+' '+(a.addr2||'')).trim();
  var defLabel=a.defenseExp==='none'?'없음 ✅ 가점 해당':'있음 ❌';
  var fileSec=buildFileSection(a);

  /* 상태 알림 */
  var statusNotice='';
  if(a.status==='검토중'){
    statusNotice='<div class="status-notice review"><span style="font-size:20px;">🔍</span><div><strong>검토중</strong> — 기업의 신청서 수정이 잠겨있습니다.</div></div>';
  } else if(a.status==='선정'){
    statusNotice='<div class="status-notice ok"><span style="font-size:20px;">🎉</span><div><strong>선정 완료</strong> — 기업에게 선정 안내가 표시됩니다.</div></div>';
  } else if(a.status==='미선정'){
    statusNotice='<div class="status-notice no"><span style="font-size:20px;">📋</span><div><strong>미선정</strong> — 기업에게 미선정 안내가 표시됩니다.</div></div>';
  }

  document.getElementById('modalBody').innerHTML=
    statusNotice+
    dsec('기업 기본 정보',[
      ['접수번호','<span style="font-family:monospace;color:var(--accent);font-weight:700;">'+h(a.refNum)+'</span>'],
      ['기업명',h(a.company)],
      ['사업자번호','<span style="font-family:monospace;">'+h(a.bizNum)+'</span>'],
      ['기업유형',h(a.corpType||'—')],
      ['대표자',h(a.ceo)],
      ['개업연월',h(a.openDate)],
      ['주소',h(addr||'—')],
      ['담당자',h(a.contact)+' | '+h(a.phone)],
      ['이메일',h(a.email)],
      ['종업원',h(a.employees||'—')+'명'],
    ])+
    dsec('기술 및 사업 내용',[
      ['기술분야',h(a.tech||'—')],
      ['방산경험','<span style="font-weight:600;'+(a.defenseExp==='none'?'color:var(--green)':'color:var(--red)')+';">'+defLabel+'</span>'],
      ['매출(전전년)',h(a.sales1||'—')+'만원'],
      ['매출(전년)',h(a.sales2||'—')+'만원'],
      ['부채비율',h(a.debt||'—')],
      ['기술설명','<span style="white-space:pre-wrap;">'+h(a.techDesc||'—')+'</span>'],
      ['국방분야 적용','<span style="white-space:pre-wrap;">'+h(a.defApp||'—')+'</span>'],
      ['목표/성장전략','<span style="white-space:pre-wrap;">'+h(a.goal||'—')+'</span>'],
    ])+
    dsec('신청 일정',[
      ['신청일',h(a.appliedAt||'—')],
      ['수정일',h(a.updatedAt&&a.updatedAt!==a.appliedAt?a.updatedAt:'—')],
    ])+
    '<div class="d-sec"><div class="d-sec-title">제출 서류</div>'+fileSec+'</div>'+
    '<div style="margin-top:14px;"><div style="font-size:11px;font-weight:700;color:var(--t2);margin-bottom:5px;">담당자 메모</div>'+
    '<textarea class="note-area" id="detailNote" placeholder="검토 메모, 면담 내용, 평가 의견 등...">'+h(a.note||'')+'</textarea></div>';

  var sel=document.getElementById('detailStatus');
  sel.innerHTML=['검토대기','검토중','선정','미선정'].map(function(s){
    return '<option value="'+s+'"'+(a.status===s?' selected':'')+'>'+s+'</option>';
  }).join('');

  // Drive 폴더 링크
  var folderLink = a.driveFolder
    ? '<div style="margin-bottom:10px;"><a href="'+h(a.driveFolder)+'" target="_blank" style="color:var(--accent);font-size:13px;font-weight:600;text-decoration:none;">📁 Google Drive 폴더 열기 →</a></div>'
    : '';
  document.getElementById('modalBody').innerHTML = folderLink + document.getElementById('modalBody').innerHTML;
  document.getElementById('detailModal').classList.add('on');
}

function dsec(title,rows){
  return '<div class="d-sec"><div class="d-sec-title">'+title+'</div>'+
    rows.map(function(r){return '<div class="d-row"><div class="d-key">'+r[0]+'</div><div class="d-val">'+r[1]+'</div></div>';}).join('')+'</div>';
}
function closeDetail(){ document.getElementById('detailModal').classList.remove('on'); curId=null; }

async function saveDetail(){
  var a=null;
  for(var i=0;i<apps.length;i++){if(String(apps[i].id)===String(curId)){a=apps[i];break;}}
  if(!a)return;
  a.status=document.getElementById('detailStatus').value;
  a.note=document.getElementById('detailNote').value;
  try{await fetch(API_BASE+'/api/admin/apps/'+curId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:a.status,note:a.note})});}catch(e){}
  saveLocal(); closeDetail(); renderStats(); renderTable();
}

async function resetPwBtn(){
  var a=null;
  for(var i=0;i<apps.length;i++){if(String(apps[i].id)===String(curId)){a=apps[i];break;}}
  if(!a)return;
  var tempPw=document.getElementById('tempPwInput').value.trim();
  if(!tempPw){alert('임시 비밀번호를 입력하세요');return;}
  if(!confirm(a.company+' 비밀번호를 "'+tempPw+'"로 초기화하시겠습니까?'))return;
  try{
    var res=await fetch(API_BASE+'/api/admin/reset-pw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bizNum:a.bizNum,tempPw:tempPw})});
    var data=await res.json();
    alert(data.ok?'초기화 완료. 기업에 임시 비밀번호 전달: '+tempPw:'실패: '+(data.error||''));
  }catch(e){alert('서버 오류: '+e.message);}
}

/* CSV */
function exportCSV(){
  var hdrs=['접수번호','기업명','사업자번호','대표자','개업연월','기업유형','주소','담당자','연락처','이메일','종업원','기술분야','방산경험','매출전전년','매출전년','부채비율','신청일','수정일','상태','메모'];
  var rows=apps.map(function(a){
    return [a.refNum,a.company,a.bizNum,a.ceo,a.openDate,a.corpType,
      '"'+((a.addr||'')+' '+(a.addr2||'')).trim()+'"',
      a.contact,a.phone,a.email,a.employees,a.tech,
      a.defenseExp==='none'?'없음(가점)':'있음',
      a.sales1,a.sales2,a.debt,a.appliedAt,a.updatedAt,a.status,
      '"'+(a.note||'').replace(/"/g,'""')+'"'].join(',');
  });
  var csv='\uFEFF'+hdrs.join(',')+'\n'+rows.join('\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var el=document.createElement('a');el.href=url;el.download='K방산스타트업_신청기업목록.csv';el.click();
}

function saveLocal(){ localStorage.setItem(SK_APPS,JSON.stringify(apps)); }
</script>
