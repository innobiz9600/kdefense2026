<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-방산 스타트업 1단계 육성사업 관리시스템</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0F3E6E;--navy2:#185FA5;--navy-lt:#E6F1FB;
  --teal:#0A5C45;--teal2:#0F6E56;--teal-lt:#E1F5EE;
  --amber:#7A4400;--amber-lt:#FAEEDA;
  --coral:#7A2A10;--coral-lt:#FAECE7;
  --purple:#3A2F9E;--purple-lt:#EEEDFE;
  --gray:#F0F2F5;--border:#DDE1E7;--border2:#B8C0CC;
  --text:#151F2E;--text2:#3D4A5C;--text3:#7A8799;
  --white:#FFFFFF;--danger:#B03020;
  --sidebar-w:200px;
}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--gray);color:var(--text);font-size:15px;min-height:100vh;cursor:default}
*{cursor:inherit}
a,button,.btn,.sb-item,.co-table tbody tr,.expert-card button,.dp-step-item,.step-check-item,[onclick]{cursor:pointer!important}
input,select,textarea{cursor:text!important}

.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--navy)}
.login-box{background:var(--white);border-radius:16px;padding:44px 40px;width:380px}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo .kd{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--navy2);background:var(--navy-lt);padding:4px 12px;border-radius:20px;display:inline-block;margin-bottom:12px}
.login-logo h1{font-size:20px;font-weight:700;color:var(--navy);line-height:1.4}
.login-logo p{font-size:13px;color:var(--text3);margin-top:6px}
.form-group{margin-bottom:16px}
.form-group label{font-size:13px;font-weight:600;color:var(--text2);display:block;margin-bottom:7px}
.form-group input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:9px;font-size:15px;color:var(--text);outline:none}
.form-group input:focus{border-color:var(--navy2)}
.login-btn{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer!important;margin-top:8px}
.login-btn:hover{background:var(--navy2)}
.login-err{color:var(--danger);font-size:13px;margin-top:10px;text-align:center;min-height:20px}
.login-hint{font-size:12px;color:var(--text3);text-align:center;margin-top:16px;line-height:1.8;background:var(--gray);padding:10px;border-radius:8px}

.app{display:none;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:var(--navy);display:flex;flex-direction:column;z-index:100}
.sb-logo{padding:22px 18px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-badge{font-size:10px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.45);margin-bottom:7px}
.sb-title{font-size:13px;font-weight:700;color:#fff;line-height:1.5}
.sb-period{font-size:11px;color:rgba(255,255,255,.38);margin-top:5px}
.sb-nav{flex:1;padding:14px 10px;overflow-y:auto}
.sb-section{font-size:10px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.28);padding:14px 8px 7px}
.sb-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;cursor:pointer!important;color:rgba(255,255,255,.62);font-size:14px;transition:all .15s;margin-bottom:3px}
.sb-item:hover{background:rgba(255,255,255,.09);color:#fff}
.sb-item.active{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.sb-item svg{width:17px;height:17px;flex-shrink:0}
.sb-cnt{margin-left:auto;background:rgba(255,255,255,.18);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px}
.sb-footer{padding:14px 18px;border-top:1px solid rgba(255,255,255,.1)}
.sb-user{font-size:12px;color:rgba(255,255,255,.45)}
.sb-user span{color:rgba(255,255,255,.85);font-weight:600}
.logout-btn{font-size:12px;color:rgba(255,255,255,.38);cursor:pointer!important;margin-top:5px;background:none;border:none;padding:0}
.logout-btn:hover{color:#fff}

.main{margin-left:var(--sidebar-w);padding:28px 32px;min-height:100vh}
.page{display:none}
.page.active{display:block}
.page-header{margin-bottom:24px;display:flex;align-items:flex-end;justify-content:space-between}
.page-header-left h2{font-size:22px;font-weight:700;color:var(--navy)}
.page-header-left p{font-size:14px;color:var(--text3);margin-top:4px}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:var(--white);border-radius:13px;padding:20px 22px;border:1px solid var(--border)}
.stat-label{font-size:12px;color:var(--text3);font-weight:600;letter-spacing:.04em;margin-bottom:8px}
.stat-val{font-size:30px;font-weight:700;color:var(--navy);line-height:1}
.stat-sub{font-size:12px;color:var(--text3);margin-top:5px}
.stat.teal .stat-val{color:var(--teal2)}
.stat.amber .stat-val{color:#BA7517}
.stat.purple .stat-val{color:var(--purple)}
.stat.red .stat-val{color:var(--coral)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.card{background:var(--white);border-radius:13px;border:1px solid var(--border);padding:20px 24px}
.card-title{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:16px;display:flex;align-items:center;gap:7px}

.phase-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.phase-name{font-size:13px;color:var(--text2);width:120px;flex-shrink:0}
.phase-bar-bg{flex:1;height:9px;background:var(--border);border-radius:4px;overflow:hidden}
.phase-bar-fill{height:100%;border-radius:4px;transition:width .5s}
.phase-cnt{font-size:12px;color:var(--text3);width:36px;text-align:right}

.tl-row{display:flex;gap:7px;align-items:flex-start;margin-bottom:8px}
.tl-month{font-size:13px;color:var(--text3);width:32px;flex-shrink:0;padding-top:3px;font-weight:600}
.tl-chips{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.chip{font-size:11px;padding:3px 8px;border-radius:5px;font-weight:500}
.chip.bl{background:var(--navy-lt);color:#0C447C}
.chip.tl{background:var(--teal-lt);color:#085041}
.chip.am{background:var(--amber-lt);color:#633806}
.chip.co{background:var(--coral-lt);color:#712B13}
.chip.pu{background:var(--purple-lt);color:#3C3489}

.todo-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:9px;background:var(--gray);margin-bottom:7px}
.todo-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.todo-dot.urgent{background:#E84B3A}
.todo-dot.normal{background:var(--border2)}
.todo-text{font-size:13px;color:var(--text);flex:1}
.todo-badge{font-size:11px;padding:2px 7px;border-radius:4px;background:var(--amber-lt);color:var(--amber);font-weight:600}

.toolbar{display:flex;gap:10px;margin-bottom:18px;align-items:center;flex-wrap:wrap}
.toolbar input{padding:10px 14px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;color:var(--text);outline:none;width:220px}
.toolbar input:focus{border-color:var(--navy2)}
.toolbar select{padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;color:var(--text2);outline:none;background:var(--white)}
.btn{padding:10px 18px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer!important;border:none;transition:all .15s}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy2)}
.btn-sm{padding:6px 11px;font-size:12px;font-weight:600;border-radius:7px;cursor:pointer!important;border:none}
.btn-outline{background:transparent;border:1.5px solid var(--border2);color:var(--text2)}
.btn-outline:hover{border-color:var(--navy2);color:var(--navy2)}
.btn-danger{background:#FAECE7;color:#993C1D;border:none}
.co-cnt{font-size:13px;color:var(--text3);margin-left:auto}

.co-table-wrap{background:var(--white);border-radius:13px;border:1px solid var(--border);overflow:hidden}
.co-table{width:100%;border-collapse:collapse}
.co-table th{background:#F7F8FA;font-size:12px;font-weight:700;color:var(--text3);padding:12px 16px;text-align:left;border-bottom:1px solid var(--border)}
.co-table td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
.co-table tr:last-child td{border-bottom:none}
.co-table tr:hover td{background:#F8F9FB}
.co-num{font-size:12px;color:var(--text3);font-weight:600}
.co-name-cell{font-weight:700;color:var(--navy);font-size:15px}
.sec-badge{font-size:11px;padding:3px 8px;border-radius:5px;font-weight:600}
.steps-grid{display:flex;flex-wrap:wrap;gap:4px}
.sdot{width:22px;height:22px;border-radius:4px;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700;border:1px solid transparent}
.sdot.done{background:var(--teal-lt);color:#085041;border-color:#9FE1CB}
.sdot.pending{background:#F0F2F5;color:#AAB2BE;border-color:var(--border)}
.action-btns{display:flex;gap:6px}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:16px;width:660px;max-height:90vh;overflow-y:auto;padding:32px;position:relative}
.modal-lg{width:760px}
.modal-title{font-size:19px;font-weight:700;color:var(--navy);margin-bottom:24px}
.modal-close{position:absolute;right:24px;top:24px;background:none;border:none;cursor:pointer!important;color:var(--text3);font-size:22px;line-height:1}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-row.full{grid-template-columns:1fr}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.03em}
.field input,.field select,.field textarea{padding:10px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;color:var(--text);outline:none;font-family:inherit;background:var(--white)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy2)}
.field textarea{resize:vertical;min-height:80px}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}

.steps-check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.step-check-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:9px;border:1.5px solid var(--border);cursor:pointer!important;transition:all .15s;background:var(--white)}
.step-check-item:hover{border-color:var(--navy2);background:var(--navy-lt)}
.step-check-item.checked{border-color:#9FE1CB;background:var(--teal-lt)}
.step-check-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--teal2);cursor:pointer!important;flex-shrink:0}
.step-check-label{font-size:13px;color:var(--text);font-weight:500;line-height:1.3}
.step-check-month{font-size:11px;color:var(--text3);margin-top:1px}

.detail-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:150}
.detail-overlay.open{display:block}
.detail-panel{position:fixed;right:0;top:0;bottom:0;width:460px;background:var(--white);z-index:151;overflow-y:auto;box-shadow:-6px 0 40px rgba(0,0,0,.14);padding:28px;display:none}
.detail-panel.open{display:block}
.dp-close{float:right;background:none;border:none;cursor:pointer!important;color:var(--text3);font-size:20px}
.dp-co-name{font-size:22px;font-weight:700;color:var(--navy);margin-top:6px;margin-bottom:5px}
.dp-co-sub{font-size:13px;color:var(--text3);margin-bottom:18px}
.dp-sec-title{font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--border);margin-top:20px}
.dp-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dp-info-item{background:var(--gray);border-radius:9px;padding:11px 14px}
.dp-info-label{font-size:11px;color:var(--text3);margin-bottom:4px;font-weight:600}
.dp-info-val{font-size:13px;color:var(--text);font-weight:500}
.dp-steps-grid{display:flex;flex-direction:column;gap:7px}
.dp-step-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border);cursor:pointer!important;transition:all .15s;background:var(--white)}
.dp-step-item:hover{border-color:var(--navy2)}
.dp-step-item.done{background:var(--teal-lt);border-color:#9FE1CB}
.dp-step-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700;color:var(--text3)}
.dp-step-item.done .dp-step-check{background:var(--teal2);border-color:var(--teal2);color:#fff}
.dp-step-body{flex:1}
.dp-step-name{font-size:14px;font-weight:600;color:var(--text)}
.dp-step-item.done .dp-step-name{color:var(--teal)}
.dp-step-month{font-size:11px;color:var(--text3);margin-top:2px}
.dp-step-outs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.dp-step-out{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--white);border:1px solid var(--border);color:var(--text2)}
.memo-box{background:var(--gray);border-radius:9px;padding:14px 16px;font-size:13px;color:var(--text2);min-height:60px;line-height:1.7;white-space:pre-wrap}

.expert-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.expert-card{background:var(--white);border-radius:13px;border:1px solid var(--border);padding:18px 20px}
.expert-name{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px}
.expert-org{font-size:13px;color:var(--text2);margin-bottom:4px}
.expert-actions{display:flex;gap:7px;margin-top:14px}

/* CALENDAR */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-nav{display:flex;align-items:center;gap:12px}
.cal-nav button{background:none;border:1.5px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer!important;font-size:14px;color:var(--text2)}
.cal-nav button:hover{border-color:var(--navy2);color:var(--navy2)}
.cal-month-title{font-size:18px;font-weight:700;color:var(--navy)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day-header{text-align:center;font-size:12px;font-weight:700;color:var(--text3);padding:8px 0}
.cal-day{min-height:90px;background:var(--white);border:1px solid var(--border);border-radius:8px;padding:6px;position:relative}
.cal-day.other-month{background:#F8F9FB;opacity:.5}
.cal-day.today{border-color:var(--navy2);border-width:2px}
.cal-day-num{font-size:12px;font-weight:600;color:var(--text3);margin-bottom:4px}
.cal-day.today .cal-day-num{color:var(--navy2)}
.cal-event{font-size:10px;padding:2px 5px;border-radius:4px;margin-bottom:2px;cursor:pointer!important;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-event.type-schedule{background:var(--navy-lt);color:#0C447C}
.cal-event.type-education{background:var(--amber-lt);color:#633806}
.cal-event.type-milestone{background:var(--teal-lt);color:#085041}
.cal-event.type-budget{background:var(--purple-lt);color:#3C3489}

/* EDUCATION */
.edu-card{background:var(--white);border-radius:13px;border:1px solid var(--border);padding:20px 24px;margin-bottom:14px}
.edu-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.edu-num{font-size:22px;font-weight:700;color:var(--navy2);width:36px}
.edu-title{font-size:16px;font-weight:700;color:var(--navy)}
.edu-meta{font-size:13px;color:var(--text3);margin-top:3px}
.edu-status-badge{font-size:12px;padding:4px 10px;border-radius:6px;font-weight:600}
.edu-body{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.edu-result-box{background:var(--gray);border-radius:9px;padding:12px 14px;font-size:13px;color:var(--text2);min-height:50px;line-height:1.7;white-space:pre-wrap}

/* BUDGET */
const BUD_ITEMS = {
  '인건비': ['내부인건비'],
  '연구재료비': ['시제품 제작비','시험·성능·평가비'],
  '연구활동비': ['과제기획 컨설팅비','추가 기술 컨설팅비','방산교육 강사비','강의교안 제작비','혁신진단 전문가 수당','육성협의체 운영비','정책자문비','회의비','교육장 임차료','사업설명회·IR 행사비','혁신진단시스템 활용비','국내여비','교재 제작비'],
  '간접비': ['회계감사비'],
  '기타': ['기타'],
};

function renderBudget(){
  const total=budgets.reduce((s,b)=>s+b.budget,0);
  // 집행액: executions에서 누적 합산
  const totalExec=executions.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const rate=total>0?Math.round(totalExec/total*100):0;
  const remain=total-totalExec;

  document.getElementById('bud-total-stat').textContent=total.toLocaleString();
  document.getElementById('bud-exec-stat').textContent=totalExec.toLocaleString();
  document.getElementById('bud-rate-stat').textContent=rate;
  document.getElementById('bud-remain-stat').textContent=remain.toLocaleString();
  const rc=document.getElementById('bud-remain-stat-card');
  rc.className='stat'+(remain<0?' red':'');

  // 비목별 집행액 계산
  const execByItem={};
  executions.forEach(e=>{
    const key=e.budItem||e.budCat||'기타';
    execByItem[key]=(execByItem[key]||0)+(parseFloat(e.amount)||0);
  });
  const execByCat={};
  executions.forEach(e=>{
    const key=e.budCat||'기타';
    execByCat[key]=(execByCat[key]||0)+(parseFloat(e.amount)||0);
  });

  // 비목별 총괄표
  const cats=[...new Set(budgets.map(b=>b.category))];
  let rows='';
  cats.forEach(cat=>{
    const items=budgets.filter(b=>b.category===cat);
    const catBud=items.reduce((s,b)=>s+b.budget,0);
    const catExec=execByCat[cat]||0;
    const catRemain=catBud-catExec;
    const catRate=catBud>0?Math.round(catExec/catBud*100):0;
    rows+=`<tr style="background:#F7F8FA">
      <td colspan="2" style="padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;color:var(--navy2)">${cat}</td>
      <td style="padding:10px 14px;border-bottom:1px solid var(--border);text-align:right;font-weight:700">${catBud.toLocaleString()}</td>
      <td style="padding:10px 14px;border-bottom:1px solid var(--border);text-align:right;font-weight:700">${catExec.toLocaleString()}</td>
      <td style="padding:10px 14px;border-bottom:1px solid var(--border)"><div style="font-size:12px;font-weight:700;color:${catRate>80?'var(--coral)':'var(--teal2)'}">${catRate}%</div><div class="bud-bar-bg"><div class="bud-bar" style="width:${Math.min(catRate,100)}%;background:${catRate>80?'#993C1D':'var(--teal2)'}"></div></div></td>
      <td style="padding:10px 14px;border-bottom:1px solid var(--border);text-align:right;font-weight:700;color:${catRemain<0?'var(--danger)':'var(--teal2)'}">${catRemain.toLocaleString()}</td>
      <td style="padding:10px 14px;border-bottom:1px solid var(--border)"></td>
    </tr>`;
    items.forEach(b=>{
      const bExec=execByItem[b.name]||0;
      const r=b.budget>0?Math.round(bExec/b.budget*100):0;
      const rem=b.budget-bExec;
      rows+=`<tr>
        <td style="padding:10px 14px 10px 28px;border-bottom:1px solid var(--border);font-size:11px;color:var(--text3)"></td>
        <td style="padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px">${b.name}<br><span style="font-size:11px;color:var(--text3)">${b.detail||''}</span></td>
        <td style="padding:10px 14px;border-bottom:1px solid var(--border);text-align:right;font-size:13px">${b.budget.toLocaleString()}</td>
        <td style="padding:10px 14px;border-bottom:1px solid var(--border);text-align:right;font-size:13px;font-weight:600;color:var(--navy2)">${bExec.toLocaleString()}</td>
        <td style="padding:10px 14px;border-bottom:1px solid var(--border)"><div style="font-size:12px;font-weight:600;color:${r>100?'var(--danger)':r>80?'#BA7517':'var(--text2)'}">${r}%</div><div class="bud-bar-bg"><div class="bud-bar" style="width:${Math.min(r,100)}%;background:${r>100?'var(--danger)':r>80?'#BA7517':'var(--navy2)'}"></div></div></td>
        <td style="padding:10px 14px;border-bottom:1px solid var(--border);text-align:right;font-size:13px;color:${rem<0?'var(--danger)':'var(--text)'}">${rem.toLocaleString()}</td>
        <td style="padding:10px 14px;border-bottom:1px solid var(--border)"><div class="action-btns">
          <button class="btn-sm btn-outline" onclick="openBudModal('${b.id}')">수정</button>
          <button class="btn-sm btn-danger" onclick="deleteBud('${b.id}')">삭제</button>
        </div></td>
      </tr>`;
    });
  });

  const tf=`<tr class="total">
    <td colspan="2" style="padding:12px 14px;border-top:2px solid var(--border2);font-weight:700">합계</td>
    <td style="padding:12px 14px;border-top:2px solid var(--border2);text-align:right;font-weight:700">${total.toLocaleString()}</td>
    <td style="padding:12px 14px;border-top:2px solid var(--border2);text-align:right;font-weight:700;color:var(--navy2)">${totalExec.toLocaleString()}</td>
    <td style="padding:12px 14px;border-top:2px solid var(--border2)"><span style="font-size:14px;font-weight:700;color:${rate>80?'var(--coral)':'var(--teal2)'}">${rate}%</span></td>
    <td style="padding:12px 14px;border-top:2px solid var(--border2);text-align:right;font-weight:700;color:${remain<0?'var(--danger)':'var(--teal2)'}">${remain.toLocaleString()}</td>
    <td style="padding:12px 14px;border-top:2px solid var(--border2)"></td>
  </tr>`;
  document.getElementById('bud-tbody').innerHTML=rows;
  document.getElementById('bud-tfoot').innerHTML=tf;

  // 집행 내역 목록
  const filterCat=document.getElementById('exec-filter')?document.getElementById('exec-filter').value:'';
  const sorted=[...executions]
    .filter(e=>!filterCat||e.budCat===filterCat)
    .sort((a,b)=>b.date.localeCompare(a.date));

  const execList=document.getElementById('exec-list');
  if(sorted.length===0){
    execList.innerHTML='<div style="text-align:center;padding:32px;color:var(--text3);font-size:14px">집행 내역이 없습니다. "+ 집행 내역 입력" 버튼을 눌러 추가하세요.</div>';
    return;
  }

  // 날짜별 누적합 계산 (전체 기준)
  const allSorted=[...executions].sort((a,b)=>a.date.localeCompare(b.date));
  const cumMap={};
  let cum=0;
  allSorted.forEach(e=>{
    cum+=(parseFloat(e.amount)||0);
    cumMap[e.id]=cum;
  });

  execList.innerHTML=`<table class="bud-table">
    <thead><tr>
      <th style="width:100px">집행일</th>
      <th style="width:90px">비목</th>
      <th style="width:130px">세부항목</th>
      <th>집행 내용</th>
      <th style="width:100px">거래처</th>
      <th style="text-align:right;width:100px">집행액(만원)</th>
      <th style="text-align:right;width:110px">누적집행액</th>
      <th style="text-align:right;width:100px">잔액</th>
      <th style="width:70px">관리</th>
    </tr></thead>
    <tbody>${sorted.map(e=>{
      const amt=parseFloat(e.amount)||0;
      const cumAmt=cumMap[e.id]||0;
      const rem=total-cumAmt;
      return '<tr>'
        +'<td style="font-size:13px">'+e.date+'</td>'
        +'<td><span class="chip bl" style="font-size:10px">'+(e.budCat||'-')+'</span></td>'
        +'<td style="font-size:12px;color:var(--text2)">'+(e.budItem||'-')+'</td>'
        +'<td style="font-size:13px;font-weight:500;color:var(--navy)">'+(e.desc||'-')+'</td>'
        +'<td style="font-size:12px;color:var(--text3)">'+(e.vendor||'-')+'</td>'
        +'<td style="text-align:right;font-size:13px;font-weight:700;color:var(--navy2)">'+amt.toLocaleString()+'</td>'
        +'<td style="text-align:right;font-size:12px;color:var(--text2)">'+cumAmt.toLocaleString()+'</td>'
        +'<td style="text-align:right;font-size:12px;font-weight:700;color:'+(rem<0?'var(--danger)':'var(--teal2)')+'">'+rem.toLocaleString()+'</td>'
        +'<td><div class="action-btns">'
        +'<button class="btn-sm btn-outline" onclick="openExecModal(\''+e.id+'\')">수정</button>'
        +'<button class="btn-sm btn-danger" onclick="deleteExec(\''+e.id+'\')">삭제</button>'
        +'</div></td>'
        +'</tr>';
    }).join('')}</tbody>
  </table>`;
}

function openExecModal(id){
  editExecId=id||null;
  const e=id?executions.find(x=>x.id===id):null;
  document.getElementById('exec-modal-title').textContent=e?'집행 내역 수정':'집행 내역 입력';
  const today=new Date().toISOString().slice(0,10);
  document.getElementById('ex-date').value=e?e.date:today;
  document.getElementById('ex-bud-cat').value=e?e.budCat||'':'';
  document.getElementById('ex-amount').value=e?e.amount||0:0;
  document.getElementById('ex-vendor').value=e?e.vendor||'':'';
  document.getElementById('ex-desc').value=e?e.desc||'':'';
  document.getElementById('ex-memo').value=e?e.memo||'':'';
  updateBudItems(e?e.budCat:'');
  setTimeout(()=>{
    if(e&&e.budItem){
      const sel=document.getElementById('ex-bud-item');
      if(sel)sel.value=e.budItem;
    }
  },50);
  document.getElementById('execModal').classList.add('open');
}

function updateBudItems(cat){
  const sel=document.getElementById('ex-bud-item');
  const items=BUD_ITEMS[cat]||[];
  sel.innerHTML='<option value="">선택</option>'+items.map(i=>'<option>'+i+'</option>').join('');
  // budgets에서 해당 비목 항목도 추가
  const budItems=budgets.filter(b=>b.category===cat).map(b=>b.name);
  budItems.forEach(item=>{
    if(!items.includes(item)){
      const opt=document.createElement('option');
      opt.value=item;opt.textContent=item;
      sel.appendChild(opt);
    }
  });
}

function saveExec(){
  const date=document.getElementById('ex-date').value;
  const cat=document.getElementById('ex-bud-cat').value;
  const item=document.getElementById('ex-bud-item').value;
  const amount=parseFloat(document.getElementById('ex-amount').value)||0;
  const desc=document.getElementById('ex-desc').value.trim();
  if(!date||!cat||!amount||!desc){showToast('날짜, 비목, 집행액, 집행내용은 필수입니다');return;}
  const data={
    date,budCat:cat,budItem:item,
    amount,
    vendor:document.getElementById('ex-vendor').value.trim(),
    desc,
    memo:document.getElementById('ex-memo').value.trim(),
  };
  if(editExecId){
    const idx=executions.findIndex(e=>e.id===editExecId);
    if(idx>=0)executions[idx]={...executions[idx],...data};
    showToast('수정되었습니다');
  } else {
    executions.push({id:newId(),...data});
    showToast('집행 내역이 등록되었습니다');
  }
  saveData();closeModal('execModal');renderBudget();
}

function deleteExec(id){
  if(!confirm('삭제하시겠습니까?'))return;
  executions=executions.filter(e=>e.id!==id);
  saveData();renderBudget();showToast('삭제되었습니다');
}

function openBudModal(id){
  editBudId=id||null;
  const b=id?budgets.find(x=>x.id===id):null;
  document.getElementById('bud-modal-title').textContent=b?'예산 항목 수정':'예산 항목 추가';
  document.getElementById('b-category').value=b?b.category:'인건비';
  document.getElementById('b-name').value=b?b.name:'';
  document.getElementById('b-budget').value=b?b.budget:0;
  document.getElementById('b-exec').value=0;
  document.getElementById('b-detail').value=b?b.detail||'':'';
  document.getElementById('b-reason').value='';
  document.getElementById('budModal').classList.add('open');
}
function saveBud(){
  const name=document.getElementById('b-name').value.trim();
  const budget=parseInt(document.getElementById('b-budget').value)||0;
  if(!name){showToast('세부항목을 입력하세요');return;}
  const reason=document.getElementById('b-reason').value.trim();
  if(editBudId){
    const idx=budgets.findIndex(b=>b.id===editBudId);
    if(idx>=0){
      const old=budgets[idx];
      const hist=old.history||[];
      if(old.budget!==budget)hist.push({date:new Date().toISOString().slice(0,10),oldBudget:old.budget,newBudget:budget,reason});
      budgets[idx]={...old,category:document.getElementById('b-category').value,name,budget,detail:document.getElementById('b-detail').value.trim(),history:hist};
    }
    showToast('수정되었습니다');
  } else {
    budgets.push({id:newId(),category:document.getElementById('b-category').value,name,budget,exec:0,detail:document.getElementById('b-detail').value.trim(),history:[]});
    showToast('등록되었습니다');
  }
  saveData();closeModal('budModal');renderBudget();
}
function deleteBud(id){if(!confirm('삭제하시겠습니까?'))return;budgets=budgets.filter(b=>b.id!==id);saveData();renderBudget();showToast('삭제되었습니다');}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
</script>
</body>
</html>
